<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGL</title>

<style>
/* 60-30-10 from the palette: black base (60), deep reds #830000 / #BC0202 (30), bright red #FF0000 (10). White for type. */
:root{
  --base:#000000; --base-2:#830000; --surface:#FFFFFF; --on-surface:#000000;
  --text:#FFFFFF; --text-soft:rgba(255,255,255,.7); --line:rgba(255,255,255,.25);
  --accent:#FF0000; --accent-2:#BC0202; --on-accent:#FFFFFF; --pop:#FFFFFF; --deep:#830000; --mid:#BC0202;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --base:#000000; --base-2:#830000; --surface:#F4F4F4; --text:#FFFFFF; }
}
:root[data-theme="dark"]{ --base:#000000; --base-2:#830000; --surface:#F4F4F4; --text:#FFFFFF; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--base)}
body{margin:0; min-height:100%; background:var(--base); color:var(--text);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif; font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input{font:inherit; color:inherit}
.wrap{max-width:760px; margin:0 auto; padding:22px 20px 130px; min-height:100%; display:flex; flex-direction:column}
.wrap.wide{max-width:1240px; padding-bottom:28px}
.muted{color:var(--text-soft)}
.small{font-size:14px}
.display{font-family:"Anton","Impact","Arial Narrow Bold",sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:.005em; line-height:.95}

/* Top bar */
.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.brand{font-family:"Anton",Impact,sans-serif; font-size:26px; background:none; border:0; padding:0; cursor:pointer; color:var(--text)}
.circle{width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:var(--surface); color:var(--on-surface); border:0; cursor:pointer}

/* Puzzle text with vowel reveal */
.puzzle{font-family:"Anton",Impact,sans-serif; text-transform:uppercase; line-height:1; text-align:center; letter-spacing:.01em}
.puzzle .word{display:inline-block; white-space:nowrap}
.puzzle .sp{display:inline-block; width:.28em}
.puzzle .v{display:inline-block; max-width:0; opacity:0; overflow:hidden; vertical-align:bottom; color:var(--accent);
  transition:max-width .5s cubic-bezier(.2,.9,.2,1), opacity .35s ease}
.puzzle.revealed .v{max-width:1.3em; opacity:1}
@supports (overflow:clip){ .puzzle .v{overflow:clip; overflow-x:clip; overflow-y:visible} }
.play-size{font-size:clamp(3rem, 12vw, 6.6rem)}
.host-size{font-size:clamp(3.4rem, 12vw, 11rem)}
.logo{font-size:clamp(6rem, 30vw, 13rem); line-height:1; cursor:pointer; position:relative; z-index:1}
.logo .v{color:var(--accent); transition:max-width .7s cubic-bezier(.7,0,.2,1), opacity .5s ease}

/* Vowel crew mascots */
.crew{display:flex; justify-content:center; align-items:flex-end; gap:clamp(0px,1vw,10px); margin-top:-6px}
.crew svg{display:block; overflow:visible}
.mascot{transition:opacity .3s, filter .3s}
.mascot.dim{opacity:.4; filter:grayscale(1)}
.mascot.hop{animation:hop .7s cubic-bezier(.3,1.6,.5,1) both}
.mascot.out{opacity:0; transform:translateY(20px)}
@keyframes hop{0%{transform:translateY(24px) scale(.85); opacity:0}60%{transform:translateY(-16px) scale(1.05); opacity:1}100%{transform:none; opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}

.hero{text-align:center; margin-top:1vh; position:relative}
.presenters{position:relative; margin:-9% -20px 0; z-index:2}
.presenters::before{content:""; position:absolute; inset:12% 8% 0; background:radial-gradient(closest-side, var(--mid), var(--deep) 55%, transparent); z-index:-1}
.presenters img{display:block; width:100%; height:auto; -webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent); mask-image:linear-gradient(to bottom,#000 78%,transparent)}
.presenters.in img{animation:rise .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0; transform:translateY(30px)}to{opacity:1; transform:none}}
.tagline{font-family:"Archivo",sans-serif; font-weight:800; text-align:center; font-size:clamp(22px,5vw,28px); line-height:1.15; max-width:20ch; margin:22px auto 26px}

/* Mode cards */
.cards{display:grid; gap:12px}
.card{appearance:none; border:0; cursor:pointer; text-align:left; border-radius:5px; padding:20px 22px; background:var(--surface); color:var(--on-surface);
  display:flex; align-items:center; gap:16px; transition:transform .12s}
.card:active{transform:scale(.98)}
.card{background:var(--deep); color:var(--text)}
.card.hot{background:linear-gradient(135deg,var(--accent),var(--mid)); color:var(--on-accent)}
.card.dark{background:var(--base); color:var(--text); box-shadow:inset 0 0 0 2px var(--mid)}
.card b{display:block; font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:30px; text-transform:uppercase; line-height:1}
.card span{font-weight:600; opacity:.88}
.card .num{font-family:"Anton",Impact,sans-serif; font-size:46px; line-height:1; color:var(--pop)}

/* Buttons */
.btn{appearance:none; border:0; cursor:pointer; border-radius:5px; padding:15px 24px; font-weight:800; font-size:17px; background:var(--surface); color:var(--on-surface); transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.hot{background:var(--accent); color:var(--on-accent)}
.btn.line{background:transparent; color:var(--text); box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.35; cursor:default; transform:none}
:is(.btn,.chip,.card,.circle,.brand,.nav button,input):focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.center{justify-content:center}

.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{appearance:none; border:0; cursor:pointer; padding:11px 18px; border-radius:5px; background:var(--base); color:var(--text); font-weight:700; font-size:16px; box-shadow:inset 0 0 0 2px var(--mid)}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); box-shadow:none}
.big-chip{font-size:19px; padding:14px 22px}
h2{font-family:"Anton",Impact,sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(44px,11vw,72px); line-height:.95; margin:6px 0 8px}
h3{font-weight:800; font-size:17px; margin:24px 0 10px}

.meta{display:flex; justify-content:space-between; align-items:center; font-weight:700}
.pill{display:inline-block; padding:7px 14px; border-radius:5px; background:var(--deep); font-weight:700; font-size:15px}
.pill.hot{background:var(--accent); color:var(--on-accent); box-shadow:none}
.label{text-align:center; margin:4px 0 10px}
.desc{text-align:center; color:var(--text-soft); font-size:18px; line-height:1.35; max-width:36ch; margin:0 auto 16px}
.host-desc{font-size:clamp(20px,2.4vw,30px); max-width:44ch}
.stage-box{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:40vh}
.hints{list-style:none; padding:0; margin:18px auto 0; display:flex; flex-direction:column; align-items:center; gap:8px}
.hints li{background:var(--deep); color:var(--text); border-radius:5px; padding:9px 18px; font-weight:700; font-size:17px}
.hints li span{color:#FF8080; margin-right:4px}
.guess{display:flex; gap:8px; margin:24px auto 0; max-width:560px; width:100%; background:var(--surface); border-radius:5px; padding:6px}
.guess input{flex:1; min-width:0; border:0; background:transparent; padding:10px 16px; font-size:18px; font-weight:600; color:var(--on-surface)}
.guess input::placeholder{color:#767676}
.feedback{text-align:center; min-height:26px; margin-top:14px; font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* Results */
.score{font-family:"Anton",Impact,sans-serif; font-size:clamp(6rem,30vw,11rem); line-height:.9; text-align:center; color:var(--accent)}
.badges{display:flex; justify-content:center; gap:14px; margin:18px 0 6px}
.badge{width:96px; aspect-ratio:1; display:grid; place-items:center; text-align:center; background:var(--deep); color:var(--text);
  clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.badge b{font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:30px; line-height:1; display:block}
.badge small{font-weight:700; font-size:12px}
.badge.hot{background:var(--accent)}
.result-list{list-style:none; padding:0; margin:20px 0; display:grid; gap:8px}
.result-list li{display:flex; justify-content:space-between; gap:12px; padding:12px 18px; border-radius:5px; background:#1A0000; box-shadow:inset 0 0 0 1px var(--deep)}
.share-text{white-space:pre-wrap; background:#1A0000; border-radius:5px; padding:12px 16px; font-size:15px}

/* Bottom pill nav, after the inspiration */
.nav{position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:center; align-items:center; gap:18px;
  background:linear-gradient(to top, var(--base) 60%, transparent)}
.pair{display:flex; gap:18px}
.nav button{width:58px; height:58px; border-radius:50%; display:grid; place-items:center; cursor:pointer; background:var(--base); color:var(--text); border:3px solid var(--text)}

.nav button.main{width:66px; height:66px; background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.nav button:not(.main){border-color:var(--text)}
.nav button[aria-current="page"]:not(.main){background:var(--text); color:var(--base)}
.nav svg{width:24px; height:24px}

/* Host */
.host-bar{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.timer{font-family:"Anton",Impact,sans-serif; font-size:54px; min-width:2ch; text-align:center; color:var(--accent)}
.timer.out{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.peek{text-align:center; min-height:26px; font-weight:700; color:var(--accent)}
footer{margin-top:28px; text-align:center; font-size:14px; color:var(--text-soft)}
@media (prefers-reduced-motion: reduce){ .puzzle .v{transition:none} .shake,.timer.out,.mascot.hop,.bob,.presenters.in img{animation:none} }
@media (max-width:520px){ .card b{font-size:26px} .nav button{width:52px;height:52px} .nav button.main{width:60px;height:60px} }
</style>
</head>

/* ---------- puzzle text ---------- */
function PuzzleText({ answer, revealed, className = "" }){
  let vi = 0;
  const words = answer.split(" ");
  return (
    <div className={`puzzle ${className} ${revealed ? "revealed" : ""}`} aria-live="polite" aria-label={revealed ? answer : strip(answer)}>
      {words.map((w, wi) => {
        const ghost = ![...w].some(c => !VOWEL.test(c));
        const last = wi === words.length - 1;
        return (
          <React.Fragment key={wi}>
            <span className="word" aria-hidden="true">
              {[...w].map((c, ci) => VOWEL.test(c)
                ? <span key={ci} className="v" style={{transitionDelay: `${(vi++) * 70}ms`}}>{c}</span>
                : <span key={ci}>{c}</span>)}
            </span>
            {!last && (ghost ? <span className="sp v" aria-hidden="true"> </span> : " ")}
          </React.Fragment>
        );
      })}
    </div>
  );

function Hero(){
  const [phase, setPhase] = useState(0);
  const [run, setRun] = useState(0);
  useEffect(() => {
    let a, b, alive = true;
    setPhase(0);
    const start = () => {
      if (!alive) return;
      a = setTimeout(() => setPhase(1), 1300);
      b = setTimeout(() => setPhase(2), 1900);
    };
    const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).then(start);
    return () => { alive = false; clearTimeout(a); clearTimeout(b); };
  }, [run]);
  return (
    <div className="hero">
      <h1 style={{margin:0}} aria-label="NGL" title="Tap to replay" onClick={() => setRun(r => r + 1)}>
        <PuzzleText answer="NIGEL" revealed={phase === 0} className="logo" />
      </h1>
      <div className={`presenters ${phase === 2 ? "in" : ""}`} style={{visibility: phase === 2 ? "visible" : "hidden"}}>
        <img src={PRESENTERS} alt="Cartoon of the Heart FM presenters pointing at the camera" width="1200" height="675" />
      </div>
    </div>
  );
}

/* ---------- setup ---------- */
const CATS = [{ id: "music", name: "Songs" }, { id: "artists", name: "Artists" }, { id: "movies", name: "Movies" }, { id: "mix", name: "Mix it up" }];
const DECADES = ["All", "80s", "90s", "2000s", "South African"];

function Setup({ host, onStart }){
  const [cat, setCat] = useState("music");
  const [decade, setDecade] = useState("All");
  const [genre, setGenre] = useState("All");
  const [easy, setEasy] = useState(false);
  useEffect(() => { setGenre("All"); }, [cat, decade]);

  const base = PUZZLES.filter(p => (cat === "mix" || p.category === cat) && (cat !== "music" || decade === "All" || p.decade === decade));
  const genres = cat === "mix" ? [] : ["All", ...new Set(base.map(p => p.genre))];
  const pool = base.filter(p => (genre === "All" || p.genre === genre) && (!easy || p.difficulty === 1));

  return (
    <>
      <h2>{host ? "Host mode" : "Pick your round"}</h2>
      <p className="muted">{host ? "Big text for the studio screen. You run the hints, the reveal and the timer." : `${ROUND} puzzles. Fewer hints, more points.`}</p>
      <h3>Category</h3>
      <div className="chips">{CATS.map(c => <button key={c.id} className="chip big-chip" aria-pressed={cat === c.id} onClick={() => setCat(c.id)}>{c.name}</button>)}</div>
      {cat === "music" && <>
        <h3>Decade</h3>
        <div className="chips">{DECADES.map(d => <button key={d} className="chip" aria-pressed={decade === d} onClick={() => setDecade(d)}>{d === "All" ? "All decades" : d}</button>)}</div>
      </>}
      {genres.length > 2 && <>
        <h3>Genre</h3>
        <div className="chips">{genres.map(g => <button key={g} className="chip" aria-pressed={genre === g} onClick={() => setGenre(g)}>{g === "All" ? "All genres" : g}</button>)}</div>
      </>}
      <h3>Difficulty</h3>
      <div className="chips">
        <button className="chip" aria-pressed={!easy} onClick={() => setEasy(false)}>Everything</button>
        <button className="chip" aria-pressed={easy} onClick={() => setEasy(true)}>Easy only</button>
      </div>
      <div className="row" style={{marginTop:30}}>
        <button className="btn hot" disabled={!pool.length} onClick={() => onStart(shuffle(pool))}>{host ? `Start show (${pool.length} puzzles)` : "Start round"}</button>
      </div>
      {!pool.length && <p className="feedback">No puzzles match those filters. Try a different genre or decade.</p>}
    </>
  );
}

/* ---------- play ---------- */
function Play({ puzzles, title, onDone }){
  const [i, setI] = useState(0);
  const [hints, setHints] = useState(0);
  const [status, setStatus] = useState("playing");
  const [guess, setGuess] = useState("");
  const [msg, setMsg] = useState("");
  const [shake, setShake] = useState(false);
  const [results, setResults] = useState([]);
  const [score, setScore] = useState(0);
  const inputRef = useRef(null), nextRef = useRef(null);
  const p = puzzles[i];
  const hintList = hintsFor(p);
  const done = status !== "playing";

  useEffect(() => { (done ? nextRef : inputRef).current?.focus(); }, [status, i]);

  function finish(outcome){
    const pts = outcome === "gave" ? 0 : Math.max(25, 100 - hints * HINT_COST);
    setScore(s => s + pts);
    setResults(r => [...r, { p, outcome: outcome === "gave" ? "gave" : hints ? "hint" : "clean", pts }]);
    setStatus(outcome === "gave" ? "revealed" : "solved");
    setMsg(outcome === "gave" ? `It was ${p.answer}.` : `Got it. +${pts}`);
  }
  function submit(e){
    if (e && e.preventDefault) e.preventDefault();
    if (!guess.trim()){ setMsg("Type an answer first."); inputRef.current?.focus(); return; }
    if (isMatch(guess, p.answer)) finish("solved");
    else { setMsg("Not quite. Try again, or take a hint."); setShake(true); setTimeout(() => setShake(false), 400); }
  }
  function next(){
    if (i + 1 >= puzzles.length){ onDone(results, score); return; }
    setI(i + 1); setHints(0); setStatus("playing"); setGuess(""); setMsg("");
  }

  return (
    <>
      <div className="meta"><span className="pill">{i + 1} of {puzzles.length}</span><span className="pill hot">{score} pts</span></div>
      <div className="stage-box">
        <div className="label"><span className="pill">{label(p)}</span></div>
        {p.desc && <p className="desc">{p.desc}</p>}
        <div className={shake ? "shake" : ""}><PuzzleText answer={p.answer} revealed={done} className="play-size" /></div>
        <Crew size={46} active={done ? vowelsIn(p.answer) : null} hopKey={done ? i + 1 : 0} />
        <ul className="hints">{hintList.slice(0, hints).map((h, k) => <li key={k}><span>Hint {k + 1}</span> {h}</li>)}</ul>
        {!done ? (
          <>
            <div className="guess" role="group" aria-label="Your guess">
              <input ref={inputRef} value={guess} onChange={e => setGuess(e.target.value)} onKeyDown={e => { if (e.key === "Enter") submit(e); }} enterKeyHint="go" placeholder="Type your answer" aria-label="Your answer" autoComplete="off" autoCapitalize="off" spellCheck="false" />
              <button className="btn hot" type="button" onClick={submit} style={{padding:"12px 22px"}}>Guess</button>
            </div>
            <div className="row center" style={{marginTop:14}}>
              <button className="btn line" disabled={hints >= hintList.length} onClick={() => setHints(h => h + 1)}>Use a hint (−{HINT_COST})</button>
              <button className="btn line" onClick={() => finish("gave")}>Reveal answer</button>
            </div>
          </>
        ) : (
          <div className="row center" style={{marginTop:24}}>
            <button ref={nextRef} className="btn hot" onClick={next}>{i + 1 >= puzzles.length ? "See results" : "Next puzzle"}</button>
          </div>
        )}
        <div className="feedback" role="status">{msg}</div>
      </div>
    </>
  );
}

/* ---------- results ---------- */
const ICON = { clean: "✅", hint: "💡", gave: "❌" };
function Results({ data, onAgain, onHome }){
  const [copied, setCopied] = useState(null);
  const solved = data.results.filter(r => r.outcome !== "gave").length;
  const used = data.results.filter(r => r.outcome === "hint").length;
  const text = `NGL ${data.title}\n${data.results.map(r => ICON[r.outcome]).join("")}\n${solved}/${data.results.length} solved, ${data.score} points`;
  function share(){
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => setCopied("ok"), () => setCopied("show"));
    else setCopied("show");
  }
  return (
    <>
      <h2 style={{textAlign:"center"}}>{data.title}</h2>
      <div className="score">{data.score}</div>
      <div className="badges">
        <div className="badge hot"><div><b>{solved}/{data.results.length}</b><small>solved</small></div></div>
        <div className="badge"><div><b>{used}</b><small>with hints</small></div></div>
        <div className="badge"><div><b>{data.results.length - solved}</b><small>revealed</small></div></div>
      </div>
      <ul className="result-list">{data.results.map((r, k) => <li key={k}><span>{ICON[r.outcome]} {r.p.answer}</span><span className="muted">{r.pts}</span></li>)}</ul>
      <div className="row center">
        <button className="btn hot" onClick={share}>{copied === "ok" ? "Copied" : "Copy result"}</button>
        {onAgain && <button className="btn" onClick={onAgain}>Play again</button>}
        <button className="btn line" onClick={onHome}>Home</button>
      </div>
      {copied === "show" && <p className="share-text" style={{marginTop:16}}>{text}</p>}
    </>
  );
}

/* ---------- host ---------- */
function Host({ puzzles, onExit }){
  const [i, setI] = useState(0);
  const [hints, setHints] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const [time, setTime] = useState(null);
  const [peek, setPeek] = useState(false);
  const p = puzzles[i];
  const hintList = hintsFor(p);

  useEffect(() => {
    if (time === null || time <= 0) return;
    const t = setTimeout(() => setTime(time - 1), 1000);
    return () => clearTimeout(t);
  }, [time]);

  const go = d => { const n = i + d; if (n < 0 || n >= puzzles.length) return; setI(n); setHints(0); setRevealed(false); setTime(null); setPeek(false); };
  const hint = () => setHints(h => Math.min(h + 1, hintList.length));
  const reveal = () => { setRevealed(true); setTime(null); };
  const timer = () => setTime(30);

  useEffect(() => {
    const k = e => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") go(1);
      else if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "r" || e.key === "R") reveal();
      else if (e.key === "h" || e.key === "H") hint();
      else if (e.key === "t" || e.key === "T") timer();
      else if (e.key === " "){ e.preventDefault(); revealed ? go(1) : reveal(); }
    };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  });
  function fullscreen(){ try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} }

  return (
    <>
      <div className="host-bar">
        <span className="pill">Puzzle {i + 1} of {puzzles.length}</span>
        <span className={`timer ${time === 0 ? "out" : ""}`} aria-live="polite">{time === null ? "" : time === 0 ? "Time" : time}</span>
        <div className="row">
          <button className="btn line" onClick={fullscreen}>Full screen</button>
          <button className="btn line" onClick={onExit}>Exit</button>
        </div>
      </div>
      <div className="stage-box" style={{minHeight:"52vh"}}>
        <div className="label"><span className="pill" style={{fontSize:20}}>{label(p)}</span></div>
        {p.desc && <p className="desc host-desc">{p.desc}</p>}
        <PuzzleText answer={p.answer} revealed={revealed} className="host-size" />
        <Crew size={70} active={revealed ? vowelsIn(p.answer) : null} hopKey={revealed ? i + 1 : 0} />
        <ul className="hints">{hintList.slice(0, hints).map((h, k) => <li key={k} style={{fontSize:"clamp(20px,2.4vw,30px)"}}><span>Hint {k + 1}</span> {h}</li>)}</ul>
      </div>
      <div className="peek">{peek && !revealed ? p.answer : ""}</div>
      <div className="row center" style={{marginTop:8}}>
        <button className="btn line" onClick={() => go(-1)} disabled={i === 0}>Back</button>
        <button className="btn" onClick={hint} disabled={revealed || hints >= hintList.length}>Hint</button>
        <button className="btn" onClick={timer} disabled={revealed}>30s timer</button>
        <button className="btn line" onPointerDown={() => setPeek(true)} onPointerUp={() => setPeek(false)} onPointerLeave={() => setPeek(false)} disabled={revealed}>Hold to peek</button>
        {!revealed ? <button className="btn hot" onClick={reveal}>Reveal</button>
          : <button className="btn hot" onClick={() => go(1)} disabled={i + 1 >= puzzles.length}>Next</button>}
      </div>
      <p className="small muted" style={{textAlign:"center", marginTop:14}}>Keyboard: Space reveals, then moves on. H hint, T timer, arrows to move.</p>
    </>
  );
}

/* ---------- app ---------- */
function App(){
  const [screen, setScreen] = useState("home");
  const [round, setRound] = useState(null);
  const [result, setResult] = useState(null);
  const day = todayKey();
  const dailyDone = store.get(`ngl-daily-${day}`);

  function startDaily(){
    const set = dailyFive(day);
    setRound({ puzzles: set, title: "Today's five", daily: true, n: Date.now() });
    setScreen("play");
  }
  function done(results, score){
    setResult({ results, score, title: round.title });
    if (round.daily) store.set(`ngl-daily-${day}`, { score, solved: results.filter(r => r.outcome !== "gave").length });
    setScreen("results");
  }
  function go(s){ if (s === "daily") startDaily(); else setScreen(s); }

  return (
    <div className={`wrap ${screen === "host" ? "wide" : ""}`}>
      {screen !== "home" && screen !== "host" && (
        <div className="top">
          <button className="circle" aria-label="Back to home" onClick={() => setScreen("home")}>{Icon.back}</button>
          <button className="brand" onClick={() => setScreen("home")}>NGL</button>
          <span style={{width:52}} />
        </div>
      )}

      {screen === "home" && <>
        <Hero />
        <p className="tagline" style={{marginTop:4}}>The vowels ran off. Guess the song, artist or movie without them.</p>
        <div className="cards">
          <button className="card hot" onClick={() => setScreen("setup")}><div><b>Play a round</b><span>Songs, artists or movies. Pick a decade and genre.</span></div></button>
          <button className="card" onClick={startDaily}><span className="num">5</span><div><b>Today's five</b>
            <span>{dailyDone ? `Played today: ${dailyDone.solved}/${DAILY} for ${dailyDone.score} pts.` : "Same five for everyone, every day."}</span></div></button>
          <button className="card dark" onClick={() => setScreen("hostsetup")}><div><b>Host mode</b><span>Big screen version for the studio.</span></div></button>
        </div>
        <footer>Made for Heart 104.9 FM, Cape Town</footer>
      </>}

      {screen === "setup" && <Setup onStart={pool => { setRound({ puzzles: pool.slice(0, ROUND), title: "Your round", n: Date.now() }); setScreen("play"); }} />}
      {screen === "hostsetup" && <Setup host onStart={pool => { setRound({ puzzles: pool }); setScreen("host"); }} />}
      {screen === "play" && <Play key={round.n} puzzles={round.puzzles} title={round.title} onDone={done} />}
      {screen === "results" && <Results data={result} onHome={() => setScreen("home")} onAgain={round.daily ? null : () => setScreen("setup")} />}
      {screen === "host" && <Host puzzles={round.puzzles} onExit={() => setScreen("home")} />}

      {screen !== "host" && <Nav screen={screen} go={go} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
